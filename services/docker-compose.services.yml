version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: beatthefine-postgres
    environment:
      POSTGRES_DB: beatthefine
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d beatthefine"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NATS Server
  nats:
    image: nats:2.10-alpine
    container_name: beatthefine-nats
    command: [
      "--js", 
      "--store_dir", "/data/jetstream",
      "--max_memory_store", "256MB",
      "--max_file_store", "1GB"
    ]
    ports:
      - "4222:4222"
      - "8222:8222"  # HTTP monitoring port
    volumes:
      - nats_data:/data/jetstream
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Outbox Service
  outbox-service:
    build:
      context: ./outbox-service
      dockerfile: Dockerfile
      target: production
    container_name: beatthefine-outbox-service
    environment:
      - SERVICE_NAME=outbox-service
      - SERVICE_VERSION=1.0.0
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/beatthefine
      - NATS_URL=nats://nats:4222
      - OUTBOX_BATCH_SIZE=100
      - OUTBOX_MAX_TRIES=10
      - OUTBOX_IDLE_SLEEP_MS=500
      - PORT=8080
      - METRICS_PORT=9090
      - LOG_LEVEL=info
      - METRICS_ENABLED=true
      - NODE_ENV=production
    ports:
      - "8082:8080"  # Health/API port
      - "9092:9090"  # Metrics port
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - beatthefine-network

  # Audit Service
  audit-service:
    build:
      context: ./audit-service
      dockerfile: Dockerfile
      target: production
    container_name: beatthefine-audit-service
    environment:
      - SERVICE_NAME=audit-service
      - SERVICE_VERSION=1.0.0
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/beatthefine
      - NATS_URL=nats://nats:4222
      - NATS_STREAM_NAME=EVENTS
      - AUDIT_CONSUMER_NAME=audit-consumer
      - AUDIT_CONCURRENCY=8
      - AUDIT_BATCH_SIZE=100
      - AUDIT_ACK_WAIT_MS=30000
      - AUDIT_MAX_RETRIES=10
      - AUDIT_RETRY_DELAY_MS=1000
      - HEALTH_CHECK_INTERVAL_MS=10000
      - PORT=8080
      - METRICS_PORT=9090
      - LOG_LEVEL=info
      - DEFAULT_SERVICE=audit-service
      - DEFAULT_VERSION=1.0.0
      - NODE_ENV=production
    ports:
      - "8081:8080"  # Health/API port
      - "9091:9090"  # Metrics port
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - beatthefine-network

  # Webhook Service (if needed)
  webhook-service:
    build:
      context: ../webhook-service
      dockerfile: Dockerfile
      target: production
    container_name: beatthefine-webhook-service
    environment:
      - SERVICE_NAME=webhook-service
      - SERVICE_VERSION=1.0.0
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/beatthefine
      - NATS_URL=nats://nats:4222
      - NATS_STREAM_NAME=EVENTS
      - WEBHOOK_CONSUMER_NAME=webhook-consumer
      - WEBHOOK_FILTER_SUBJECTS=events.webhook.*
      - WEBHOOK_CONCURRENCY=5
      - WEBHOOK_BATCH_SIZE=1
      - WEBHOOK_ACK_WAIT_MS=30000
      - WEBHOOK_MAX_RETRIES=3
      - WEBHOOK_RETRY_BACKOFF_MS=1000
      - PORT=8080
      - METRICS_PORT=9090
      - NODE_ENV=production
    ports:
      - "8084:8080"  # Health/API port
      - "9094:9090"  # Metrics port
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - beatthefine-network
    profiles:
      - extended  # Only start with --profile extended

networks:
  beatthefine-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  nats_data:
    driver: local