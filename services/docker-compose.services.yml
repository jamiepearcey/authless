version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: authless-postgres
    environment:
      POSTGRES_DB: authless
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d authless"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NATS Server
  nats:
    image: nats:2.10-alpine
    container_name: authless-nats
    command: [
      "--js", 
      "--store_dir", "/data/jetstream",
      "--max_memory_store", "256MB",
      "--max_file_store", "1GB"
    ]
    ports:
      - "4222:4222"
      - "8222:8222"  # HTTP monitoring port
    volumes:
      - nats_data:/data/jetstream
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Outbox Service
  outbox-service:
    build:
      context: ./outbox-service
      dockerfile: Dockerfile
      target: production
    container_name: authless-outbox-service
    environment:
      - SERVICE_NAME=outbox-service
      - SERVICE_VERSION=1.0.0
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/authless
      - NATS_URL=nats://nats:4222
      - OUTBOX_BATCH_SIZE=100
      - OUTBOX_MAX_TRIES=10
      - OUTBOX_IDLE_SLEEP_MS=500
      - PORT=8082
      - METRICS_PORT=9092
      - LOG_LEVEL=info
      - METRICS_ENABLED=true
      - NODE_ENV=production
    ports:
      - "8082:8082"  # Health/API port
      - "9092:9092"  # Metrics port
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - authless-network

  # Audit Service
  audit-service:
    build:
      context: ./audit-service
      dockerfile: Dockerfile
      target: production
    container_name: authless-audit-service
    environment:
      - SERVICE_NAME=audit-service
      - SERVICE_VERSION=1.0.0
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/authless
      - NATS_URL=nats://nats:4222
      - NATS_STREAM_NAME=EVENTS
      - AUDIT_CONSUMER_NAME=audit-consumer
      - AUDIT_CONCURRENCY=8
      - AUDIT_BATCH_SIZE=100
      - AUDIT_ACK_WAIT_MS=30000
      - AUDIT_MAX_RETRIES=10
      - AUDIT_RETRY_DELAY_MS=1000
      - HEALTH_CHECK_INTERVAL_MS=10000
      - PORT=8081
      - METRICS_PORT=9091
      - LOG_LEVEL=info
      - DEFAULT_SERVICE=audit-service
      - DEFAULT_VERSION=1.0.0
      - NODE_ENV=production
    ports:
      - "8081:8081"  # Health/API port
      - "9091:9091"  # Metrics port
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - authless-network

  # Email Service
  email-service:
    build:
      context: ./email-service
      dockerfile: Dockerfile
      target: production
    container_name: authless-email-service
    environment:
      - SERVICE_NAME=email-service
      - SERVICE_VERSION=1.0.0
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/authless
      - NATS_URL=nats://nats:4222
      - NATS_STREAM_NAME=EVENTS
      - EMAIL_CONSUMER_NAME=email-consumer
      - EMAIL_CONCURRENCY=5
      - EMAIL_BATCH_SIZE=1
      - EMAIL_RETRY_LIMIT=3
      - EMAIL_RETRY_BACKOFF_MS=1000
      - PORT=8083
      - METRICS_PORT=9093
      - NODE_ENV=production
    ports:
      - "8083:8083"  # Health/API port
      - "9093:9093"  # Metrics port
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - authless-network
    profiles:
      - extended  # Only start with --profile extended

  # Realtime Service
  realtime-service:
    build:
      context: ./realtime-service
      dockerfile: Dockerfile
      target: production
    container_name: authless-realtime-service
    environment:
      - SERVICE_NAME=realtime-service
      - SERVICE_VERSION=1.0.0
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/authless
      - NATS_URL=nats://nats:4222
      - NATS_STREAM_NAME=EVENTS
      - REALTIME_CONSUMER_NAME=realtime-consumer
      - REALTIME_CONCURRENCY=8
      - REALTIME_BATCH_SIZE=100
      - REALTIME_ACK_WAIT_MS=30000
      - REALTIME_MAX_RETRIES=10
      - CENTRIFUGO_URL=http://centrifugo:8000
      - CENTRIFUGO_API_KEY=your-centrifugo-api-key
      - PORT=8084
      - METRICS_PORT=9094
      - NODE_ENV=production
    ports:
      - "8084:8084"  # Health/API port
      - "9094:9094"  # Metrics port
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - authless-network
    profiles:
      - extended  # Only start with --profile extended

  # Webhook Service (if needed)
  webhook-service:
    build:
      context: ../webhook-service
      dockerfile: Dockerfile
      target: production
    container_name: authless-webhook-service
    environment:
      - SERVICE_NAME=webhook-service
      - SERVICE_VERSION=1.0.0
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/authless
      - NATS_URL=nats://nats:4222
      - NATS_STREAM_NAME=EVENTS
      - WEBHOOK_CONSUMER_NAME=webhook-consumer
      - WEBHOOK_FILTER_SUBJECTS=events.webhook.*
      - WEBHOOK_CONCURRENCY=5
      - WEBHOOK_BATCH_SIZE=1
      - WEBHOOK_ACK_WAIT_MS=30000
      - WEBHOOK_MAX_RETRIES=3
      - WEBHOOK_RETRY_BACKOFF_MS=1000
      - PORT=8085
      - METRICS_PORT=9095
      - NODE_ENV=production
    ports:
      - "8085:8085"  # Health/API port
      - "9095:9095"  # Metrics port
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - authless-network
    profiles:
      - extended  # Only start with --profile extended

networks:
  authless-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  nats_data:
    driver: local